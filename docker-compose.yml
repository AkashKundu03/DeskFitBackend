# DeskFit backend stack for a single VPS.
#   docker compose --env-file .env.production up -d --build
#
# Services:
#   postgres  – database, NOT published to the host (internal network only)
#   api       – NestJS API, published on PORT (default 3000)
#   caddy     – OPTIONAL HTTPS reverse proxy (enable with: --profile proxy)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env.production
    # No `ports:` on purpose — Postgres stays private to the compose network.
    volumes:
      - deskfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    # Publish the API so it can be reached / health-checked. When you put Caddy
    # in front and only want HTTPS exposed, change this to "127.0.0.1:3000:3000"
    # so the API is reachable only locally + via Caddy.
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional HTTPS reverse proxy. Enable with `--profile proxy` and edit Caddyfile.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  deskfit_pgdata:
  caddy_data:
  caddy_config:
